<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="把你的课程资料变成可练习的习题：本地解析 PDF / Word / PPT / 文本，自动出题、章节练习、错题复习、考试模拟。">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="习题工坊">
<meta name="format-detection" content="telephone=no">
<title>习题工坊 QuizForge · 资料一键变习题</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b5bd6'/%3E%3Ctext x='32' y='44' font-size='34' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'%3EQ%3C/text%3E%3C/svg%3E">
<style>
/* QuizForge · 习题工坊 — design system */
:root{
  --bg:#f6f7fb;
  --bg-deep:#eceefa;
  --surface:#ffffff;
  --surface-2:#fbfbfe;
  --surface-3:#f1f3fa;
  --text:#12141c;
  --text-soft:#3d4353;
  --muted:#6b7284;
  --line:#e5e8f1;
  --line-2:#d9ddeb;
  --brand:#5b5bd6;
  --brand-2:#8b5cf6;
  --brand-3:#22d3ee;
  --brand-soft:#eeeefe;
  --ok:#0f9d58;
  --ok-soft:#e7f7ee;
  --bad:#e11d48;
  --bad-soft:#fdeef2;
  --warn:#d97706;
  --warn-soft:#fef5e6;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 10px 30px -18px rgba(16,24,40,.28);
  --shadow-lg:0 24px 60px -28px rgba(16,24,40,.35);
  --r:20px;
  --r-sm:12px;
  --r-xs:9px;
  --maxw:1180px;
  --font:"Inter","PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
html[data-theme="dark"]{
  --bg:#080a10;
  --bg-deep:#0d1018;
  --surface:#12151f;
  --surface-2:#161a26;
  --surface-3:#1c2231;
  --text:#eef1f8;
  --text-soft:#c6ccda;
  --muted:#8f98ad;
  --line:#232939;
  --line-2:#2d3448;
  --brand:#7c7cf0;
  --brand-2:#a78bfa;
  --brand-soft:#1d1f3a;
  --ok:#34d399;
  --ok-soft:#0e2a20;
  --bad:#fb7185;
  --bad-soft:#2b1220;
  --warn:#fbbf24;
  --warn-soft:#2a2110;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -24px rgba(0,0,0,.8);
  --shadow-lg:0 30px 70px -30px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14.5px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 520px at 12% -8%, color-mix(in srgb, var(--brand) 16%, transparent), transparent 62%),
    radial-gradient(760px 480px at 96% 4%, color-mix(in srgb, var(--brand-3) 13%, transparent), transparent 60%),
    radial-gradient(700px 500px at 60% 108%, color-mix(in srgb, var(--brand-2) 12%, transparent), transparent 62%);
}
a{color:var(--brand);text-decoration:none}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit}
::selection{background:color-mix(in srgb, var(--brand) 26%, transparent)}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  border-bottom:1px solid color-mix(in srgb, var(--line) 70%, transparent);
}
.topbar-inner{
  max-width:var(--maxw);margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:14px;
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;flex:0 0 auto}
.brand-mark{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand-2) 55%,var(--brand-3));
  color:#fff;font-weight:800;font-size:16px;letter-spacing:-.02em;
  box-shadow:0 6px 18px -8px color-mix(in srgb, var(--brand) 70%, transparent);
}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-title{font-weight:750;font-size:15px;letter-spacing:-.01em}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--surface-3);overflow:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{
  border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;
  padding:6px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.18s;
}
.nav-btn:hover{color:var(--text)}
.nav-btn.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--text-soft);
  white-space:nowrap;
}
.chip b{font-weight:750;color:var(--text)}
.icon-btn{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  color:var(--text-soft);cursor:pointer;display:grid;place-items:center;font-size:15px;transition:.18s;
}
.icon-btn:hover{background:var(--surface-3)}
.lvl-pill{
  display:flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 4px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);
}
.lvl-badge{
  width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));
}
.lvl-track{width:46px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.lvl-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-3))}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:22px 20px 72px}
.view{animation:fadeUp .32s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:18px;align-items:start;margin-top:18px}
.col-main,.col-side{display:flex;flex-direction:column;gap:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:10px}
.row-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.small{font-size:12.5px}
.center{text-align:center}

/* ---------- card ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:20px;
}
.card.tight{padding:16px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.card-head .en{font-size:10.5px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.card-head .spacer{flex:1}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(600px 240px at 100% 0%, color-mix(in srgb, var(--brand-3) 18%, transparent), transparent 70%),
    radial-gradient(520px 260px at 0% 110%, color-mix(in srgb, var(--brand-2) 16%, transparent), transparent 70%),
    var(--surface);
  display:flex;gap:22px;align-items:center;flex-wrap:wrap;
}
.hero-left{display:flex;align-items:center;gap:16px;min-width:250px}
.ring{--p:0;position:relative;width:88px;height:88px;flex:0 0 auto;border-radius:50%;
  background:conic-gradient(from -90deg, var(--brand) calc(var(--p)*1%), var(--surface-3) 0);
  display:grid;place-items:center;transition:--p .5s;
}
.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface);box-shadow:inset 0 1px 3px rgba(16,24,40,.06)}
.ring-inner{position:relative;z-index:1;text-align:center;line-height:1.1}
.ring-val{font-size:21px;font-weight:800;letter-spacing:-.02em}
.ring-lbl{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.hero-title{font-size:20px;font-weight:750;letter-spacing:-.02em;line-height:1.3}
.hero-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.hero-stats{display:grid;grid-template-columns:repeat(4,minmax(88px,1fr));gap:10px;flex:1;min-width:300px}
.stat{
  background:color-mix(in srgb, var(--surface-2) 88%, transparent);
  border:1px solid var(--line);border-radius:14px;padding:10px 12px;
}
.stat-val{font-size:19px;font-weight:780;letter-spacing:-.02em;line-height:1.2}
.stat-lbl{font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.stat-val small{font-size:11px;font-weight:600;color:var(--muted);margin-left:2px}

/* ---------- mode cards ---------- */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{
  text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;
  padding:14px;cursor:pointer;transition:.18s;display:flex;gap:12px;align-items:flex-start;
}
.mode:hover{border-color:color-mix(in srgb, var(--brand) 40%, var(--line));transform:translateY(-1px);box-shadow:var(--shadow)}
.mode.on{border-color:var(--brand);background:color-mix(in srgb, var(--brand-soft) 70%, var(--surface))}
.mode-body{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.mode-ico{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:0 0 auto;
  background:linear-gradient(140deg,color-mix(in srgb, var(--brand) 16%, transparent),color-mix(in srgb, var(--brand-3) 14%, transparent));
  color:var(--brand);
}
.mode-title{font-weight:700;font-size:13.5px;display:block;line-height:1.4}
.mode-desc{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45;display:block}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:11.5px;font-weight:650;color:var(--muted);letter-spacing:.04em}
.input,.select,.textarea{
  width:100%;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);
  border-radius:11px;padding:9px 11px;font-size:13.5px;font-family:inherit;outline:none;transition:.16s;
}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);background:var(--surface)}
.textarea{resize:vertical;min-height:150px;line-height:1.65}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.seg{display:inline-flex;padding:3px;background:var(--surface-3);border-radius:11px;gap:2px}
.seg-btn{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:650;padding:6px 11px;border-radius:8px;cursor:pointer;transition:.16s;white-space:nowrap}
.seg-btn:hover{color:var(--text)}
.seg-btn.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.09)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--text);
  font-size:13.5px;font-weight:650;padding:9px 16px;border-radius:11px;cursor:pointer;transition:.16s;
  white-space:nowrap;user-select:none;
}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{
  border:0;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 8px 20px -10px color-mix(in srgb, var(--brand) 80%, transparent);
}
.btn.primary:hover{filter:brightness(1.06)}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn.soft:hover{background:color-mix(in srgb, var(--brand) 14%, var(--surface))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 30%, var(--line))}
.btn.danger:hover{background:var(--bad-soft)}
.btn.lg{padding:12px 22px;font-size:14.5px;border-radius:13px}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-row{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- progress / mastery ---------- */
.bar{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-3));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.sm{height:5px}
.bar.ok > i{background:linear-gradient(90deg,var(--ok),#34d399)}
.bar.warn > i{background:linear-gradient(90deg,var(--warn),#fbbf24)}
.mastery-list{display:flex;flex-direction:column;gap:11px}
.mastery-item{display:flex;flex-direction:column;gap:5px}
.mastery-top{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
.mastery-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mastery-val{margin-left:auto;font-weight:750;font-variant-numeric:tabular-nums;font-size:12px}
.mastery-val.zero{color:var(--muted)}

/* ---------- missions ---------- */
.mission{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.mission:last-child{border-bottom:0;padding-bottom:0}
.mission:first-child{padding-top:0}
.mission-check{
  width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line-2);flex:0 0 auto;margin-top:2px;
  display:grid;place-items:center;font-size:10px;color:#fff;transition:.2s;
}
.mission.done .mission-check{background:var(--ok);border-color:var(--ok)}
.mission-body{flex:1;min-width:0}
.mission-title{font-size:12.5px;font-weight:600;line-height:1.4}
.mission-sub{font-size:11px;color:var(--muted)}
.mission-num{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}

/* ---------- achievements ---------- */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach{
  border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start;
  background:var(--surface-2);transition:.2s;
}
.ach.unlocked{border-color:color-mix(in srgb, var(--brand) 34%, var(--line));background:color-mix(in srgb, var(--brand-soft) 60%, var(--surface))}
.ach-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:0 0 auto;background:var(--surface-3);filter:grayscale(1);opacity:.6}
.ach.unlocked .ach-ico{filter:none;opacity:1;background:linear-gradient(140deg,color-mix(in srgb, var(--brand) 18%, transparent),color-mix(in srgb, var(--brand-3) 16%, transparent))}
.ach-name{font-size:12.5px;font-weight:700;line-height:1.3}
.ach-desc{font-size:11px;color:var(--muted);line-height:1.4;margin-top:1px}
.ach.unlocked .ach-name::after{content:" ✓";color:var(--brand)}

/* ---------- lists / items ---------- */
.list{display:flex;flex-direction:column;gap:9px}
.item{
  border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:var(--surface-2);
  display:flex;gap:11px;align-items:flex-start;transition:.16s;
}
.item:hover{border-color:var(--line-2)}
.item-main{flex:1;min-width:0}
.item-title{font-size:13px;font-weight:600;line-height:1.5}
.item-sub{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.badge{
  display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;
  background:var(--surface-3);color:var(--text-soft);white-space:nowrap;letter-spacing:.02em;
}
.badge.brand{background:var(--brand-soft);color:var(--brand)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.tag{font-size:10.5px;color:var(--muted);background:var(--surface-3);padding:1px 6px;border-radius:5px}
.empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:12.5px}
.empty-ico{font-size:26px;opacity:.5;display:block;margin-bottom:6px}

/* ---------- dropzone / generator ---------- */
.drop{
  border:1.5px dashed var(--line-2);border-radius:14px;padding:18px;text-align:center;
  background:var(--surface-2);cursor:pointer;transition:.18s;
}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop-ico{font-size:22px;opacity:.7}
.drop-title{font-size:13px;font-weight:650;margin-top:4px}
.drop-sub{font-size:11px;color:var(--muted);margin-top:2px}
.file-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gen-item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface-2)}
.gen-item .cbx{width:16px;height:16px;margin-top:3px;accent-color:var(--brand);flex:0 0 auto}
.gen-stem{font-size:12.5px;line-height:1.55;font-weight:550}
.gen-opts{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px;margin-top:6px;font-size:11.5px;color:var(--muted);line-height:1.5}
.gen-opt{display:flex;gap:6px;min-width:0}
.gen-opt .k{font-weight:800;opacity:.8;flex:0 0 auto;font-size:10.5px;margin-top:1px}
.gen-opt b{color:var(--ok);font-weight:650}
.gen-opt span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gen-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.steps{display:flex;flex-direction:column;gap:0;padding-left:2px}
.step{display:flex;gap:11px;position:relative;padding-bottom:14px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:1.5px;background:var(--line)}
.step:last-child::before{display:none}
.step-n{width:21px;height:21px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:800;display:grid;place-items:center;flex:0 0 auto;z-index:1}
.step-title{font-size:12.5px;font-weight:650}
.step-sub{font-size:11.5px;color:var(--muted);line-height:1.5}

/* ---------- quiz ---------- */
.quiz-layer{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;display:block}
.quiz{max-width:820px;margin:0 auto;padding:20px;min-height:100vh;display:flex}
.quiz-inner{margin:auto;width:100%;display:flex;flex-direction:column;gap:16px;padding:18px 0 26px}
.quiz-top{display:flex;align-items:center;gap:12px}
.quiz-top .btn{padding:6px 10px;font-size:12px}
.quiz-prog{flex:1;display:flex;flex-direction:column;gap:5px}
.quiz-prog .row{justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600}
.quiz-timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px}
.quiz-body{animation:fadeUp .28s ease both}
.q-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.q-stem{font-size:19px;font-weight:680;line-height:1.55;letter-spacing:-.01em}
.q-stem em{font-style:normal;color:var(--brand);font-weight:750}
.q-blank{display:inline-block;min-width:3.6em;height:1.02em;vertical-align:-0.14em;margin:0 .16em;border-bottom:2px solid color-mix(in srgb, var(--brand) 52%, transparent);border-radius:1px;background:color-mix(in srgb, var(--brand) 7%, transparent)}

<noscript><p style="padding:40px;text-align:center">这个工具需要启用 JavaScript。</p></noscript>
<script>
/*!
 * QuizForge 习题工坊 — 出题引擎 (纯函数，无依赖，可在 Node 中直接测试)
 * 输入：课程资料纯文本；输出：单选题/多选题 + 解析 + 来源
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ============================ 文本工具 ============================ */

  const CJK = /[\u4e00-\u9fff]/;
  const isCJK = (s) => CJK.test(s);
  const END_PUNCT = /[。！？!?；;.]$/;

  function clean(s) {
    return String(s == null ? '' : s)
      .replace(/\u00a0/g, ' ')
      .replace(/\*+/g, '')
      .replace(/[ \t]+/g, ' ')
      .replace(/^[\s|>]+|[\s|>]+$/g, '');
  }

  function stripMd(s) {
    return clean(s)
      .replace(/\*+|__|`|~~/g, '')
      .replace(/^[「“"『【《(<]+/, '')
      .replace(/[」”"』】》)>\s]+$/, '')
      .trim();
  }

  function normKey(s) {
    return stripMd(s)
      .toLowerCase()
      .replace(/[\s，,。.．、；;：:（）()【】\[\]「」“”"'’‘<>《》/\\|]/g, '');
  }

  function grams(s) {
    const n = normKey(s);
    const out = new Set();
    for (let i = 0; i < n.length - 1; i++) out.add(n.slice(i, i + 2));
    if (!out.size && n) out.add(n);
    return out;
  }

  function jaccard(a, b) {
    if (!a.size || !b.size) return 0;
    let inter = 0;
    for (const x of a) if (b.has(x)) inter++;
    return inter / (a.size + b.size - inter);
  }

  function lcg(seed) {
    let s = (seed >>> 0) || 20240518;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function shuffle(arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function hash(str) {
    let h = 2166136261;
    const s = String(str);
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(36);
  }

  function capFirst(s) {
    const t = String(s);
    return t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
  }

  function trimText(s, max) {
    const t = clean(s);
    if (t.length <= max) return t;
    const cut = t.slice(0, max);
    const at = Math.max(cut.lastIndexOf('，'), cut.lastIndexOf('。'), cut.lastIndexOf('；'), cut.lastIndexOf('、'), cut.lastIndexOf(' '));
    return (at > max * 0.55 ? cut.slice(0, at) : cut) + '…';
  }

  /* ============================ 分句 ============================ */

  const SPLIT_RE = /(?<=[。！？!?；;])\s*|(?<=[.])\s+(?=[A-Z0-9“"(（])|\n+/;

  function splitSentences(text) {
    return String(text)
      .split(SPLIT_RE)
      .map((s) => clean(s))
      .filter((s) => s && s.length > 1);
  }

  function chunkSentence(s, max) {
    max = max || 108;
    if (s.length <= max) return [s];
    const parts = s.split(/(?<=[，,、])\s*/);
    const out = [];
    let cur = '';
    for (const p of parts) {
      if (cur && (cur + p).length > max) { out.push(cur); cur = p; }
      else cur += p;
    }
    if (cur) out.push(cur);
    return out.map((x) => clean(x)).filter((x) => x.length > 6);
  }

  /* ============================ 结构化：章节 / 小节 ============================ */

  const CH_HEAD = /^(第\s*[一二三四五六七八九十百零\d]{1,3}\s*[讲章节课篇部]|(?:lecture|chapter|unit|module|part|lesson)\s*\d+)/i;

  function headingLevel(t) {
    const hashes = (t.match(/^#+/) || [''])[0].length;
    const raw = t.replace(/^#+\s*/, '').trim();
    if (CH_HEAD.test(raw)) return 1;
    if (hashes === 1) return 1;
    if (hashes >= 2) return 2;
    if (/^\d{1,2}\s+\S/.test(raw)) return 1;
    if (/^\d{1,2}\.\d{1,2}\s*\S/.test(raw)) return 2;
    if (/^[一二三四五六七八九十]{1,2}[、.．]\s*\S/.test(raw)) return 2;
    if (/^【[^】]{1,30}】$/.test(raw)) return 2;
    return 0;
  }

  function isHeadingLine(t) {
    if (!t || t.length > 44) return false;
    if (/[。；;，,、]$/.test(t)) return false;
    return headingLevel(t) > 0;
  }

  function segment(text) {
    const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
    const blocks = [];
    let cur = '';

    const flush = () => { if (cur) { blocks.push({ kind: 'para', text: cur }); cur = ''; } };

    for (const raw of lines) {
      const t = clean(raw).replace(/^[|]+|[|]+$/g, '').trim();
      if (!t) { flush(); continue; }
      if (isHeadingLine(t)) {
        flush();
        const title = t.replace(/^#{1,4}\s*/, '').replace(/^【|】$/g, '').trim();
        blocks.push({ kind: 'head', text: title, level: headingLevel(t) });
        continue;
      }
      if (/^\|.*\|$/.test(t)) {
        flush();
        blocks.push({ kind: 'para', text: t.replace(/^\||\|$/g, '').split('|').map((x) => x.trim()).filter(Boolean).join('，') });
        continue;
      }
      const bullet = /^([-*•·▪◦–—]|\d{1,2}[.)、])\s+/.test(t) || /^[①②③④⑤⑥⑦⑧⑨⑩]/.test(t);
      const glossary = /^[^：:]{1,26}[：:]/.test(t) && t.length < 180;
      if (bullet) {
        flush();
        blocks.push({ kind: 'item', text: t.replace(/^([-*•·▪◦–—]|\d{1,2}[.)、])\s+/, '').trim() });
        continue;
      }
      if (glossary) { flush(); blocks.push({ kind: 'para', text: t }); continue; }
      if (cur && END_PUNCT.test(cur)) flush();
      if (cur) {
        const needSpace = /[A-Za-z0-9,;:.]$/.test(cur) && /^[A-Za-z0-9(（]/.test(t);
        cur += (needSpace ? ' ' : '') + t;
      } else cur = t;
    }
    flush();
    return blocks;
  }

  function buildStructure(blocks) {
    const chapters = [];
    let ch = null;
    let topic = null;

    function newChapter(title) {
      ch = { title: title, topics: [] };
      chapters.push(ch);
      topic = null;
    }
    function newTopic(title) {
      if (!ch) newChapter('全部内容');
      topic = { title: title, blocks: [] };
      ch.topics.push(topic);
    }
    function ensure() {
      if (!ch) newChapter('全部内容');
      if (!topic) newTopic('总览');
      return topic;
    }

    for (const b of blocks) {
      if (b.kind === 'head') {
        if (b.level === 1) { newChapter(b.text); }
        else { newTopic(b.text); }
        continue;
      }
      ensure().blocks.push(b);
    }
    // 清理空章节
    const out = chapters
      .map((c) => ({ title: c.title, topics: c.topics.filter((t) => t.blocks.length) }))
      .filter((c) => c.topics.length);
    if (!out.length && blocks.length) out.push({ title: '全部内容', topics: [{ title: '总览', blocks: blocks.slice() }] });
    return out;
  }

  /* ============================ 术语 / 定义抽取 ============================ */

  const DEF_VERBS = ['被定义为', '定义为', '指的是', '是指', '被称为', '称为', '叫做', '即', '是'];
  const BAD_TERM_START = /^(这|那|它|他|她|我|你|们|其|此|该|每|某|有|没|不|很|更|最|也|都|就|还|并且|而且|但|而|所以|因此|由于|如果|当|在|对|从|到|把|被|为|以|与|和|及|或|是|的|上|下|中|内|外|前|后)/;
  const BAD_TERMS = new Set([
    '注意', '备注', '说明', '提示', '例如', '比如', '小结', '总结', '目录', '思考', '练习', '作业',
    '参考', '延伸', '要点', '重点', '难点', '案例', '导入', '回顾', '复习', '问题', '答案', '解析',
    '定义', '概念', '理论', '研究', '方法', '内容', '目的', '意义', '作用', '特点', '分类', '区别',
    '联系', '步骤', '过程', '结果', '结论', '讨论', '附录', '参考文献', '温馨提示', '学习方法',
    '课堂活动', '目标', '要求', '时间', '安排', '资料', '考点', '本章', '本节', '上次', '下次',
  ]);

  function validTerm(t) {
    if (!t) return false;
    if (t.length < 2 || t.length > 40) return false;
    const cjkLen = (t.match(/[\u4e00-\u9fff]/g) || []).length;
    if (cjkLen > 10) return false;
    if (/[，。；：、！？（）()\[\]“”"'…—–|]/.test(t)) return false;
    if (/^[\d.\s\-—–]+$/.test(t)) return false;
    if (!isCJK(t) && !/[A-Za-z]{2,}/.test(t)) return false;
    if (BAD_TERM_START.test(t)) return false;
    if (BAD_TERMS.has(t)) return false;
    if (/[的地得则也却而但并又不只再都]$/.test(t)) return false;
    if (/^(因为|所以|但是|如果|虽然|只是|就是|还有|然后|因此|并且|于是|否则|这时|那时|其中|尤其|同时|相反|当然|其实|可能|大概|几乎|往往|总是|一直|已经|正在|将要|不会|没有|不能|可以|应该|有时|许多|很多|一些|这种|那种|这些|那些|结论|结果|原因|答案|过程|意义|作用|特点|目的|内容|案例|例如|比如|注意|说明|提示)/.test(t)) return false;
    if (/[把被让使就都也还很过得着]/.test(t)) return false;
    if (/(分为|分成|包括|包含|由|使|让|可以|能够|需要|具有|作为|称为|叫做|指的是|是指|定义|的|是|等$)/.test(t)) return false;
    if (t.split(/\s+/).length > 5) return false;
    return true;
  }

  function parseDefinition(raw) {
    const s = clean(raw);
    if (s.length < 12 || s.length > 210) return null;

    // 1) 中英对照 / 冒号式： 「工作记忆 (working memory)：容量有限的系统」
    const colon = s.match(/^([^：:]{2,28})\s*[：:]\s*(.{4,180})$/);
    if (colon) {
      const term = stripMd(colon[1]);
      const def = clean(colon[2]);
      if (validTerm(term) && def.length >= 4 && !/^\s*[（(]/.test(def)) return { term: term, def: def };
    }

    // 2) 中文定义动词
    for (const v of DEF_VERBS) {
      const idx = s.indexOf(v);
      if (idx < 2) continue;
      const term = stripMd(s.slice(0, idx));
      const def = clean(s.slice(idx + v.length));
      if (validTerm(term) && def.length >= 8) return { term: term, def: def };
    }

    // 3) 英文定义
    const en = s.match(/^([A-Z][A-Za-z0-9'’\-\s]{1,46}?)\s+(?:is|are|refers to|means|is defined as|is called|denotes)\s+(.{14,220})$/);
    if (en && !/\s(is|are|refers)\s/i.test(en[1])) return { term: capFirst(clean(en[1]).replace(/^(a|an|the)\s+/i, '')), def: clean(en[2]) };

    return null;
  }

  /** 一句话里可能塞了两个定义（「信度是指……，效度是指……」），按第二个定义动词切开 */
  function splitByDefs(s) {
    const re = /[，,]\s*(?=[^，,]{2,18}(?:是指|指的是|定义为|被定义为|是))/g;
    const cuts = [];
    let m;
    while ((m = re.exec(s))) cuts.push(m.index);
    if (!cuts.length) return [s];
    const parts = [];
    let start = 0;
    cuts.forEach((i) => { parts.push(s.slice(start, i)); start = i + 1; });
    parts.push(s.slice(start));
    return parts.map(clean).filter(Boolean);
  }

  function splitItems(s) {
    return String(s)
      .split(/[、，,；;]|\s+and\s+|\s*\/\s*/)
      .map((x) => stripMd(x).replace(/[。！？；;.]+$/, ''))
      .filter((x) => x && x.length <= 36 && !/[。！？!]/.test(x) && !/^(等等|等|其他|其它|etc)$/i.test(x));
  }

  function parseEnum(text) {
    const t = clean(text);
    const m = t.match(/^(.*?)\s*(?:包括|包含|分为|可分为|分成|有以下|如下|主要有|主要分为|(?:is|are)\s+divided\s+into|divides?\s+into|consists?\s+of|comprises?|includes?|contains?|has\s+(?:\w+\s+){0,3}(?:parts|divisions|types|stages|components|categories|sections|kinds|branches))\s*[：:]?\s*(.+)$/i);
    if (!m) return null;
    const body = m[2].replace(/^[^、，,；;：:]{0,8}[：:]/, '');
    const items = splitItems(body);
    if (items.length < 3 || items.length > 12) return null;
    const title = stripMd(m[1]).replace(/[的地得]$/, '');
    return { title: title, items: items };
  }

  /* ============================ 文档解析 ============================ */

  function parse(text) {
    const raw = String(text || '');
    const blocks = segment(raw);
    const chapters = buildStructure(blocks);

    const terms = [];
    const termIndex = new Map(); // normKey -> term object
    const sentences = [];        // {text, chapter, topic, idx}
    const enums = [];            // {title, items, chapter, topic, source}
    const numbers = [];          // {sentence, value, unit, chapter, topic}

    chapters.forEach((ch, ci) => {
      ch.topics.forEach((tp, ti) => {
        let sIdx = 0;
        tp.blocks.forEach((b) => {
          const sents = splitSentences(b.text);
          sents.forEach((s) => {
            sIdx++;
            const rec = { text: s, chapter: ch.title, topic: tp.title, idx: sIdx, chapterIdx: ci, topicIdx: ti };
            sentences.push(rec);

            const addDef = (d, src) => {
              const key = normKey(d.term);
              const prev = termIndex.get(key);
              if (!prev) {
                const t = {
                  term: d.term, def: d.def, chapter: ch.title, topic: tp.title,
                  sentence: src, chapterIdx: ci, topicIdx: ti, count: 1, src: 'def',
                };
                termIndex.set(key, t);
                terms.push(t);
              } else {
                prev.count++;
                if (prev.def.length < 12 && d.def.length > prev.def.length && d.def.length < 150) prev.def = d.def;
              }
            };

            let gotDef = false;
            splitByDefs(s).forEach((part) => {
              if (part.length < 10) return;
              const d = parseDefinition(part);
              if (d) { addDef(d, part); gotDef = true; }
            });
            if (!gotDef) {
              const d = parseDefinition(s);
              if (d) addDef(d, s);
            }

            const e = parseEnum(s);
            if (e) enums.push({ title: e.title, items: e.items, chapter: ch.title, topic: tp.title, source: s, chapterIdx: ci, topicIdx: ti });

            const numRe = /(\d+(?:\.\d+)?)\s*(%|秒|毫秒|分钟|小时|天|周|月|年|个|种|次|倍|位|名|分)/g;
            let nm;
            while ((nm = numRe.exec(s))) {
              const v = parseFloat(nm[1]);
              const isYear = nm[2] === '年' && v >= 1800 && v <= 2100;
              const before = s.slice(Math.max(0, nm.index - 2), nm.index);
              const isPart = /[\/／.．\-±<>＜＞+]$/.test(before);
              if (!isYear && !isPart && v < 100000 && nm.index >= 6) {
                numbers.push({ sentence: s, value: nm[1], unit: nm[2], chapter: ch.title, topic: tp.title, chapterIdx: ci, topicIdx: ti });
                break;
              }
            }
          });
        });

        // 连续 bullet 项目 → 枚举
        let run = [];
        const flushRun = () => {
          const gloss = run.filter((x) => /[：:]/.test(x)).length;
          if (gloss * 2 < run.length && run.length >= 3 && run.length <= 12) {
            enums.push({ title: tp.title === '总览' ? ch.title : tp.title, items: run.slice(), chapter: ch.title, topic: tp.title, source: run.join('、'), chapterIdx: ci, topicIdx: ti });
          }
          run = [];
        };
        tp.blocks.forEach((b) => {
          if (b.kind === 'item') {
            const it = stripMd(b.text);
            if (it.length <= 30) run.push(it); else flushRun();
          } else flushRun();
        });
        flushRun();
      });
    });

    // 术语频次：统计在正文中出现次数
    terms.forEach((t) => {
      const k = normKey(t.term);
      let n = 0;
      sentences.forEach((s) => { if (normKey(s.text).indexOf(k) >= 0) n++; });
      t.sentences = n;
      t.weight = Math.min(6, n) + (t.def.length > 24 ? 2 : 0);
    });

    return {
      chapters: chapters, sentences: sentences, terms: terms, enums: enums, numbers: numbers,
      chars: raw.length,
      lang: (function () {
        const cjk = (raw.match(/[\u4e00-\u9fff]/g) || []).length;
        const lat = (raw.match(/[A-Za-z]/g) || []).length;
        return cjk >= lat * 0.6 ? 'zh' : 'en';
      })(),
      stat: {
        chapters: chapters.length,
        sentences: sentences.length,
        terms: terms.length,
        enums: enums.length,
      },
    };
  }

  /* ============================ 干扰项选择 ============================ */

  function buildSimilarity(terms) {
    const sim = new Map();
    terms.forEach((a, i) => {
      const ga = grams(a.term);
      sim.set(i, []);
      terms.forEach((b, j) => {
        if (i === j) return;
        let s = jaccard(ga, grams(b.term));
        if (a.chapter === b.chapter) s += 0.35;
        if (a.topic === b.topic) s += 0.15;
        if (Math.abs(a.chapterIdx - b.chapterIdx) <= 1) s += 0.08;
        s += Math.min(0.2, jaccard(grams(a.def), grams(b.def)));
        sim.get(i).push({ j: j, s: s });
      });
      sim.get(i).sort((x, y) => y.s - x.s);
    });
    return sim;
  }

  /* ============================ 题目构造 ============================ */

  function makeId(type, stem) {
    return 'q' + hash(type + '|' + normKey(stem)).slice(0, 8);
  }

  function normOpts(opts) {
    return opts.map((o) => clean(o)).filter(Boolean);
  }

  function distinctOptions(list, maxSim) {
    const out = [];
    for (const o of list) {
      const g = grams(o);
      if (out.some((x) => jaccard(g, grams(x)) > (maxSim || 0.78))) continue;
      out.push(o);
    }
    return out;
  }

  function finalize(cand, rnd) {
    // 打乱选项并定位答案
    const idx = cand.options.map((_, i) => i);
    const order = shuffle(idx, rnd);
    const options = order.map((i) => {
      const o = String(cand.options[i]).replace(/[。；;]$/, '');
      return cand.lang === 'en' ? capFirst(o) : o;
    });
    const answer = cand.answer.map((i) => order.indexOf(i)).sort((a, b) => a - b);
    const q = {
      id: makeId(cand.type, cand.stem),
      type: cand.type,
      chapter: cand.chapter,
      topic: cand.topic,
      difficulty: cand.difficulty,
      stem: cand.stem,
      options: options,
      answer: answer,
      explain: cand.explain,
      source: cand.source,
      lang: cand.lang,
      kind: cand.kind || 'cloze',
      term: cand.term || '',
      auto: true,
    };
    return { q: q, score: cand.score };
  }

  function buildAll(doc, opts) {
    const rnd = lcg(opts.seed || 7);
    const terms = doc.terms;
    const sim = buildSimilarity(terms);
    const cands = [];

    const byTermSentences = new Map();
    const termKeys = terms.map((t) => normKey(t.term));
    doc.sentences.forEach((s) => {
      const sentKey = normKey(s.text);
      terms.forEach((t, i) => {
        const k = termKeys[i];
        if (k && sentKey.indexOf(k) >= 0) {
          if (!byTermSentences.has(i)) byTermSentences.set(i, []);
          byTermSentences.get(i).push(s);
        }
      });
    });

    function nearTerms(i, k) {
      const list = (sim.get(i) || []).slice(0, Math.max(12, k * 4));
      const picked = shuffle(list, rnd).slice(0, k);
      return picked.map((x) => terms[x.j]).filter(Boolean);
    }

    terms.forEach((t, i) => {
      const lang = doc.lang;
      const base = { chapter: t.chapter, topic: t.topic, lang: lang };

      /* --- 1. 术语 → 定义 --- */
      if (t.def && t.def.length >= 4) {
        const dist = nearTerms(i, 6).filter((x) => x.def && x.def.length >= 4 && jaccard(grams(x.def), grams(t.def)) < 0.5);
        const optsDefs = distinctOptions([trimText(t.def, 92)].concat(dist.map((d) => trimText(d.def, 92))), 0.72).slice(0, 4);
        if (optsDefs.length === 4) {
          cands.push(finalize({
            kind: 'termDef', term: t.term, type: 'single', difficulty: '理解',
            stem: lang === 'zh'
              ? '关于「' + t.term + '」，下列哪一项最符合课程资料中的描述？'
              : 'Which of the following best describes “' + t.term + '”?',
            options: optsDefs, answer: [0],
            explain: '「' + t.term + '」：' + t.def,
            source: t.sentence,
            score: 10 + Math.min(4, t.weight) + (t.def.length > 20 ? 2 : 0),
            chapter: base.chapter, topic: base.topic, lang: lang,
          }, rnd));
        }
      }

      /* --- 2. 定义 → 术语 --- */
      if (t.def && t.def.length >= 4 && t.def.length <= 150 && normKey(t.def).indexOf(normKey(t.term)) < 0) {
        const dist = nearTerms(i, 6).map((x) => x.term);
        const optsTerms = distinctOptions([t.term].concat(dist), 0.82).slice(0, 4);
        if (optsTerms.length === 4) {
          cands.push(finalize({
            kind: 'defTerm', term: t.term, type: 'single', difficulty: '记忆',
            stem: lang === 'zh'
              ? '「' + trimText(t.def, 96) + '」—— 这段描述对应下列哪一个概念？'
              : '“' + trimText(t.def, 110) + '” — which concept does this describe?',
            options: optsTerms, answer: [0],
            explain: '资料原文：' + t.sentence,
            source: t.sentence,
            score: 9 + Math.min(4, t.weight),
            chapter: base.chapter, topic: base.topic, lang: lang,
          }, rnd));
        }
      }

      /* --- 3. 完形填空 --- */
      const sents = (byTermSentences.get(i) || []).filter((s) => s.text.length >= 14 && s.text.length <= 130);
      let best = null;
      sents.forEach((s) => {
        let st = s.text;
        const gm = st.match(/^([^：:，,。]{2,18})[：:]\s*/);
        if (gm && gm[1] !== t.term && st.indexOf(t.term) > gm[0].length) st = st.slice(gm[0].length);
        const at = st.indexOf(t.term);
        if (at < 0) return;
        if (at === 0 && /^[^：:，,。]{2,18}[：:]/.test(st)) return; // 纯词条式，已由「定义→术语」覆盖
        const before = st.slice(0, at);
        let after = st.slice(at + t.term.length);
        if (after.length < 6) return;
        const cue = /例如|比如|实验|患者|案例|情境|情景|当你|如果|为了|假如/.test(st);
        const score = (cue ? 10 : 7) + Math.min(3, t.weight) + (before.length > 8 ? 1 : 0);
        if (!best || score > best.score) best = { s: s, st: st, at: at, before: before, after: after, score: score, cue: cue };
      });
      if (best) {
        const dist = nearTerms(i, 6).map((x) => x.term);
        const optsTerms = distinctOptions([t.term].concat(dist), 0.82).slice(0, 4);
        if (optsTerms.length === 4) {
          const blank = lang === 'zh' ? '＿＿＿＿' : '______';
          cands.push(finalize({
            kind: 'cloze', term: t.term, type: 'single', difficulty: best.cue ? '情景' : '记忆',
            stem: lang === 'zh'
              ? '补全原文：' + best.before + blank + best.after
              : 'Complete this statement from the material: ' + best.before + blank + best.after,
            options: optsTerms, answer: [0],
            explain: '原文：' + best.s.text,
            source: best.s.text,
            score: best.score,
            chapter: base.chapter, topic: base.topic, lang: lang,
          }, rnd));
        }
      }
    });

    /* --- 4. 枚举：不属于 / 多选 --- */
    doc.enums.forEach((e) => {
      const others = doc.enums.filter((x) => x !== e);
      const foreign = [];
      others.forEach((o) => o.items.forEach((it) => {
        if (e.items.some((x) => normKey(x) === normKey(it))) return;
        foreign.push(it);
      }));
      let uniqForeign = distinctOptions(shuffle(foreign, rnd), 0.85);
      if (uniqForeign.length < 3) {
        doc.terms.forEach((t) => {
          if (!t.term || t.term.length > 14) return;
          if (e.items.some((x) => normKey(x).indexOf(normKey(t.term)) >= 0)) return;
          if (uniqForeign.some((x) => normKey(x) === normKey(t.term))) return;
          uniqForeign.push(t.term);
        });
      }
      const title = e.title || e.topic;
      if (!title || title.length > 20) return;

      if (uniqForeign.length >= 2) {
        const correct = uniqForeign[0];
        const members = shuffle(e.items, rnd).slice(0, 3);
        const opts = distinctOptions([correct].concat(members), 0.86).slice(0, 4);
        if (opts.length === 4) {
          cands.push(finalize({
            kind: 'notMember', term: title, type: 'single', difficulty: '理解',
            stem: '下列哪一项**不属于**「' + title + '」？',
            options: opts, answer: [0],
            explain: '「' + title + '」包含：' + e.items.join('、') + '。',
            source: e.source,
            score: 8,
            chapter: e.chapter, topic: e.topic, lang: isCJK(title) ? 'zh' : 'en',
          }, rnd));
        }
      }

      if (e.items.length >= 4 && uniqForeign.length >= 2) {
        const k = Math.min(3, e.items.length - 1);
        const right = shuffle(e.items, rnd).slice(0, k);
        const wrong = uniqForeign.slice(0, Math.max(2, 4 - k));
        const opts = distinctOptions(right.concat(wrong), 0.86);
        if (opts.length >= 4 && opts.length <= 6) {
          const answer = opts.map((o, idx) => (right.some((r) => normKey(r) === normKey(o)) ? idx : -1)).filter((x) => x >= 0);
          if (answer.length >= 2) {
            cands.push(finalize({
              kind: 'multi', term: title, type: 'multiple', difficulty: '理解',
              stem: '下列哪些**属于**「' + title + '」？（多选）',
              options: opts, answer: answer,
              explain: '「' + title + '」包含：' + e.items.join('、') + '。',
              source: e.source,
              score: 6,
              chapter: e.chapter, topic: e.topic, lang: isCJK(title) ? 'zh' : 'en',
            }, rnd));
          }
        }
      }
    });

    /* --- 5. 数字细节 --- */
    doc.numbers.forEach((n) => {
      const s = n.sentence;
      if (s.length < 12 || s.length > 110) return;
      const at = s.indexOf(n.value);
      if (at < 2) return;
      const before = s.slice(0, at);
      const after = s.slice(at + n.value.length);
      if (!after.trim()) return;
      const v = parseFloat(n.value);
      const candsN = [];
      const push = (x) => {
        const str = (Math.round(x * 100) / 100).toString();
        if (str !== n.value && x > 0 && candsN.indexOf(str) < 0) candsN.push(str);
      };
      push(v * 2); push(v / 2); push(v + 1); push(Math.max(0.5, v - 1)); push(v * 3);
      const optsNums = distinctOptions([n.value].concat(candsN.slice(0, 4)), 0.99).slice(0, 4);
      if (optsNums.length < 3) return;
      const blank = '＿＿＿＿';
      cands.push(finalize({
        kind: 'number', term: '', type: 'single', difficulty: '记忆',
        stem: '根据课程资料补全：' + before + blank + after,
        options: optsNums, answer: [0],
        explain: '原文：' + s,
        source: s,
        score: 5,
        chapter: n.chapter, topic: n.topic, lang: isCJK(s) ? 'zh' : 'en',
      }, rnd));
    });

    return cands;
  }

  /* ============================ 选题 ============================ */

  const TYPE_WEIGHT = { termDef: 0.3, defTerm: 0.22, cloze: 0.28, notMember: 0.1, multi: 0.06, number: 0.04 };

  function generate(text, options) {
    const o = Object.assign({
      count: 10, types: 'mix', difficulty: 'all', chapter: 'all',
      seed: 20240518,
    }, options || {});

    const doc = parse(text);
    const warnings = [];

    if (doc.terms.length < 3) {
      warnings.push('识别到的术语只有 ' + doc.terms.length + ' 个，题目选项可能不足。建议使用「术语：定义」或「术语 是 ……」的写法，或在资料里加粗关键词。');
    }

    // 章节过滤
    let pool = doc;
    if (o.chapter && o.chapter !== 'all') {
      const filtered = Object.assign({}, doc, {
        terms: doc.terms.filter((t) => t.chapter === o.chapter),
        enums: doc.enums.filter((e) => e.chapter === o.chapter),
        numbers: doc.numbers.filter((n) => n.chapter === o.chapter),
        sentences: doc.sentences.filter((s) => s.chapter === o.chapter),
      });
      if (filtered.terms.length >= 3) pool = filtered;
    }

    let cands = buildAll(pool, { seed: o.seed, count: o.count });

    if (!cands.length) {
      return {
        ok: false,
        questions: [],
        warnings: warnings.concat('没能从这份资料中提取出可用的知识点。'),
        stat: doc.stat,
        chapters: chapterSummary(doc),
      };
    }

    // 难度过滤（不足时放宽）
    if (o.difficulty && o.difficulty !== 'all') {
      const want = Array.isArray(o.difficulty) ? o.difficulty : [o.difficulty];
      const f = cands.filter((c) => want.indexOf(c.q.difficulty) >= 0);
      if (f.length >= Math.min(4, o.count)) cands = f;
      else warnings.push('该难度下自动生成的题目较少，已混入其他难度。');
    }

    // 题型过滤（不足时放宽）
    if (o.types && o.types !== 'mix') {
      const want = Array.isArray(o.types) ? o.types : [o.types];
      const f = cands.filter((c) => want.indexOf(c.q.type) >= 0);
      if (f.length >= Math.min(4, o.count)) cands = f;
      else warnings.push('该题型下题目不足，已混入其他题型。');
    }

    // 去重 + 排序（分数 + 稳定抖动，避免每次出题顺序固定）
    cands.forEach((c) => { c.jitter = lcg(hash(c.q.id + o.seed))(); });
    cands.sort((a, b) => (b.score + b.jitter) - (a.score + a.jitter));
    const seen = new Set();
    const uniq = [];
    cands.forEach((c) => {
      const key = c.q.id;
      if (seen.has(key)) return;
      seen.add(key);
      uniq.push(c);
    });

    // 按题型加权混排，保证一套题里题型丰富
    const buckets = new Map();
    uniq.forEach((c) => {
      const tk = c.q.kind || 'cloze';
      if (!buckets.has(tk)) buckets.set(tk, []);
      buckets.get(tk).push(c);
    });
    const kinds = Array.from(buckets.keys());
    // 按权重做整份配额的分配（最大余额法），保证总数正好等于 count
    const wsum = kinds.reduce((s, tk) => s + (TYPE_WEIGHT[tk] || 0.02), 0) || 1;
    const quota = {};
    kinds.forEach((tk) => { quota[tk] = (o.count * (TYPE_WEIGHT[tk] || 0.02)) / wsum; });
    const targets = {};
    kinds.forEach((tk) => { targets[tk] = Math.floor(quota[tk]); });
    let assigned = kinds.reduce((s, tk) => s + targets[tk], 0);
    const remOrder = kinds.slice().sort((a, b) => (quota[b] - targets[b]) - (quota[a] - targets[a]));
    let oi = 0;
    while (assigned < o.count) {
      targets[remOrder[oi % remOrder.length]]++;
      assigned++;
      oi++;
    }
    // 题量够大时，每种非空题型至少 1 题
    if (o.count >= 8) {
      kinds.forEach((tk) => {
        if (targets[tk] > 0) return;
        let donor = null;
        kinds.forEach((k) => { if (targets[k] > 1 && (!donor || targets[k] > targets[donor])) donor = k; });
        if (donor) { targets[donor]--; targets[tk] = 1; }
      });
    }

    const got = {};
    const ptr = {};
    kinds.forEach((tk) => { got[tk] = 0; ptr[tk] = 0; });

    const termCap = new Map();
    const usedIds = new Set();
    const picked = [];

    function takeNext(tk) {
      const list = buckets.get(tk);
      while (ptr[tk] < list.length) {
        const c = list[ptr[tk]++];
        if (usedIds.has(c.q.id)) continue;
        const key = c.q.term || normKey(c.q.stem).slice(0, 10);
        if ((termCap.get(key) || 0) >= 2) continue;
        usedIds.add(c.q.id);
        termCap.set(key, (termCap.get(key) || 0) + 1);
        return c.q;
      }
      return null;
    }

    let guard = 0;
    while (picked.length < o.count && guard++ < 800) {
      let bestTk = null;
      let best = -1e9;
      for (const tk of kinds) {
        if (ptr[tk] >= buckets.get(tk).length) continue;
        const deficit = (targets[tk] || 0) - got[tk];
        if (deficit > best) { best = deficit; bestTk = tk; }
      }
      if (!bestTk) break;
      const q = takeNext(bestTk);
      if (!q) continue;
      picked.push(q);
      got[bestTk]++;
    }

    if (picked.length < o.count) {
      for (const c of uniq) {
        if (picked.length >= o.count) break;
        if (usedIds.has(c.q.id)) continue;
        usedIds.add(c.q.id);
        picked.push(c.q);
      }
    }

    if (picked.length < o.count) {
      warnings.push('本次只生成了 ' + picked.length + ' 道题（资料信息量限制）。');
    }

    return {
      ok: true,
      questions: picked,
      warnings: warnings,
      stat: doc.stat,
      chapters: chapterSummary(doc),
      terms: doc.terms.map((t) => ({ term: t.term, def: t.def, chapter: t.chapter })),
    };
  }

  function chapterSummary(doc) {
    const map = new Map();
    doc.terms.forEach((t) => {
      const m = map.get(t.chapter) || { title: t.chapter, terms: 0 };
      m.terms++;
      map.set(t.chapter, m);
    });
    doc.enums.forEach((e) => {
      const m = map.get(e.chapter) || { title: e.chapter, terms: 0 };
      m.terms++;
      map.set(e.chapter, m);
    });
    return Array.from(map.values());
  }

  return {
    version: '1.0.0',
    parse: parse,
    generate: generate,
    splitSentences: splitSentences,
    // 便于测试
    _internals: { segment: segment, buildStructure: buildStructure, parseDefinition: parseDefinition, normKey: normKey, isHeadingLine: isHeadingLine },
  };
});

    const count = u16(buf, eocd + 10);
    let p = u32(buf, eocd + 16);
    const entries = {};
    for (let i = 0; i < count; i++) {
      if (u32(buf, p) !== 0x02014b50) break;
      const method = u16(buf, p + 10);
      const csize = u32(buf, p + 20);
      const nameLen = u16(buf, p + 28);
      const extraLen = u16(buf, p + 30);
      const commentLen = u16(buf, p + 32);
      const localOff = u32(buf, p + 42);
      const name = new TextDecoder('utf-8').decode(buf.subarray(p + 46, p + 46 + nameLen));
      entries[name] = { method: method, csize: csize, localOff: localOff };
      p += 46 + nameLen + extraLen + commentLen;

      const e = entries[name];
      if (!e) return null;
      const lp = e.localOff;
      if (u32(buf, lp) !== 0x04034b50) return null;
      const nl = u16(buf, lp + 26);
      const el = u16(buf, lp + 28);
      const start = lp + 30 + nl + el;
      const data = buf.subarray(start, start + e.csize);
      if (e.method === 0) return new TextDecoder('utf-8').decode(data);
      if (e.method === 8) {
        const ds = new DecompressionStream('deflate-raw');
        const stream = new Blob([data]).stream().pipeThrough(ds);

      return null;

    return xml

      .replace(/<w:br\/>|<a:br\/>/g, '\n')
      .replace(/<\/(?:w:p|a:p)>/g, '\n')

  async function pptxText(file) {
    const zip = await unzip(await file.arrayBuffer());
    const slides = zip.names
      .filter((n) => /^ppt\/slides\/slide\d+\.xml$/.test(n))
      .sort((a, b) => parseInt(a.match(/(\d+)/)[1], 10) - parseInt(b.match(/(\d+)/)[1], 10));
    if (!slides.length) throw new Error('这个 pptx 里找不到幻灯片');
    const parts = [];
    for (let i = 0; i < slides.length; i++) {
      const xml = await zip.get(slides[i]);
      if (xml) parts.push('【第 ' + (i + 1) + ' 页】\n' + xmlToText(xml).trim());

    return parts.join('\n\n');

  function loadPdfjs() {
    if (!pdfjsPromise) {
      pdfjsPromise = import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4/build/pdf.min.mjs').then((m) => {
        if (m.GlobalWorkerOptions) {

    let pdfjs;
    try {

      throw new Error('PDF 解析组件加载失败（需要联网）。你可以把 PDF 里的文字直接粘贴到输入框。');
    }
    const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages = [];
    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i);
      const content = await page.getTextContent();
      const lines = [];
      let lastY = null;
      let line = '';
      content.items.forEach((it) => {
        const y = it.transform ? it.transform[5] : 0;
        if (lastY !== null && Math.abs(y - lastY) > 3) {
          lines.push(line.trim());
          line = '';
        }
        line += it.str + (it.hasEOL ? '\n' : '');
        lastY = y;
      });
      if (line.trim()) lines.push(line.trim());
      pages.push('【第 ' + i + ' 页】\n' + lines.filter(Boolean).join('\n'));
    }
    try { doc.destroy(); } catch (e) { /* ignore */ }

  }

  const TEXT_EXT = /\.(txt|md|markdown|csv|tsv|log|json|text)$/i;

  async function readFile(file) {
    if (!file) throw new Error('没有选择文件');

      return { text: text, kind: 'text', name: name };

    if (/\.docx$/i.test(name)) return { text: await docxText(file), kind: 'docx', name: name };
    if (/\.pptx$/i.test(name)) return { text: await pptxText(file), kind: 'pptx', name: name };
    if (/\.pdf$/i.test(name)) return { text: await pdfText(file), kind: 'pdf', name: name };
    if (/\.doc$/i.test(name)) throw new Error('旧版 .doc 不支持，请用 Word 另存为 .docx 或直接粘贴文字');
    if (/\.ppt$/i.test(name)) throw new Error('旧版 .ppt 不支持，请另存为 .pptx 或直接粘贴文字');
    throw new Error('暂不支持这种文件，请用 txt / md / docx / pptx / pdf，或直接粘贴文字');
  }

  function chapterList() {
    const map = new Map();
    S.bank.forEach((q) => {
      const key = q.chapter || '未分类';
      if (!map.has(key)) map.set(key, { title: key, count: 0, topics: new Set() });
      const m = map.get(key);
      m.count++;
      if (q.topic) m.topics.add(q.topic);
    });
    return Array.from(map.values());
  }

  function topicList(chapter) {
    const set = new Set();
    S.bank.forEach((q) => {
      if (chapter !== 'all' && q.chapter !== chapter) return;
      if (q.topic) set.add(q.topic);
    });
    return Array.from(set);
  }

  function masteryOf(ch) {
    const cs = S.chapterStats[ch];
    if (!cs || !cs.seen) return 0;
    return Math.round((100 * (cs.correct + 0.5)) / (cs.seen + 1));
  }

  function addQuestions(list) {
    let added = 0;
    const ids = new Set(S.bank.map((q) => q.id));
    const stems = new Set(S.bank.map((q) => normStem(q)));
    list.forEach((q) => {
      if (!q || !q.stem) return;
      if (q.type !== 'essay' && (!Array.isArray(q.options) || q.options.length < 2)) return;
      const key = normStem(q);
      if (ids.has(q.id) || stems.has(key)) return;
      ids.add(q.id);
      stems.add(key);
      S.bank.push(q);
      added++;
    });
    if (added) save(true);
    return added;
  }
  function normStem(q) { return String(q.stem || '').replace(/\s+/g, '').slice(0, 80); }

  function removeQuestion(id) {
    S.bank = S.bank.filter((q) => q.id !== id);
    S.notebook = S.notebook.filter((x) => x !== id);
    delete S.qStats[id];
    save(true);
  }

  function findQ(id) { return S.bank.find((q) => q.id === id); }

  /* ============================ 游戏化 ============================ */

  function xpToLevel(xp) {
    return clamp(Math.floor(xp / 100) + 1, 1, 50);
  }
  function levelInfo() {
    const lv = xpToLevel(S.xp);
    const base = (lv - 1) * 100;
    const next = lv >= 50 ? 1 : 100 - (S.xp - base);
    return { level: lv, progress: lv >= 50 ? 100 : Math.round(((S.xp - base) / 100) * 100), next: next, total: S.xp };
  }

  function addXp(n, silent) {
    if (!n) return;
    const before = xpToLevel(S.xp);
    S.xp += n;
    const after = xpToLevel(S.xp);

  /* ============================ 答题 ============================ */

  function pickQuestions(mode, ids) {
    if (Array.isArray(ids)) {
      const set = new Set(ids);
      return shuffle(S.bank.filter((q) => set.has(q.id)));
    }
    let pool = poolFor(mode);
    if (mode === 'mock') pool = pool.filter((q) => q.type !== 'essay');
    const want = modeCount(mode);
    if (!pool.length) return [];
    return shuffle(pool).slice(0, Math.min(want, pool.length));
  }

  function startQuiz(mode, ids) {
    const qs = pickQuestions(mode, ids);
    if (!qs.length) {
      toast(mode === 'review' ? '错题本是空的，先去练习吧' : '没有符合条件的题目，请调整筛选或先导入题库');
      return;
    }
    const total = qs.length;
    quiz = {
      mode: mode,
      questions: qs,
      idx: 0,
      answers: qs.map(() => null),
      written: qs.map(() => ''),
      picked: [],
      revealed: false,
      graded: false,
      correct: 0,
      combo: 0,
      maxCombo: 0,
      startedAt: Date.now(),
      timed: mode === 'mock',
      limit: mode === 'mock' ? total * 75 * 1000 : 0,
      remaining: mode === 'mock' ? total * 75 : 0,
      finished: false,
    };
    document.body.style.overflow = 'hidden';
    if (quiz.timed) {
      clearInterval(timer);
      timer = setInterval(() => {
        if (!quiz || quiz.finished) return;
        quiz.remaining--;
        const t = $('#quizTimer');
        if (t) t.textContent = fmtMs(quiz.remaining * 1000);
        if (quiz.remaining <= 0) finishQuiz(true);
      }, 1000);
    }
    renderQuiz();
  }

  function renderQuiz() {
    const layer = $('#quiz');
    if (!quiz) { layer.hidden = true; layer.innerHTML = ''; document.body.style.overflow = ''; return; }
    layer.hidden = false;
    if (quiz.finished) return;

    const q = quiz.questions[quiz.idx];
    const total = quiz.questions.length;
    const pct = Math.round(((quiz.idx + (quiz.revealed ? 1 : 0)) / total) * 100);
    const letters = 'ABCDEF';
    const isEssay = q.type === 'essay';

    const options = isEssay ? '' : q.options.map((o, i) => {
      let cls = 'opt';
      if (quiz.revealed) {
        if (q.answer.indexOf(i) >= 0) cls += ' ok';
        else if (quiz.picked.indexOf(i) >= 0) cls += ' bad';
        else cls += ' dim';
      } else if (quiz.picked.indexOf(i) >= 0) cls += ' sel';
      return '<button class="' + cls + '" data-act="opt" data-arg="' + i + '"' + (quiz.revealed ? ' disabled' : '') + '>' +
        '<span class="opt-key">' + letters[i] + '</span>' +
        '<span class="opt-text">' + esc(o) + '</span>' +
      '</button>';
    }).join('');

    const ok = quiz.revealed && !isEssay && sameSet(quiz.picked, q.answer);
    const explain = quiz.revealed && !isEssay
      ? '<div class="q-explain ' + (ok ? 'good' : 'bad') + '">' +
          '<div class="hd">' + (ok ? '✓ 答对了' : '✕ 答错了') + '</div>' +
          '<div>' + rich(q.explain || '') + '</div>' +
          (q.source ? '<div class="q-source">📎 ' + esc(q.source) + '</div>' : '') +
        '</div>'
      : '';

    let essayBox = '';
    if (isEssay) {
      const written = quiz.written[quiz.idx] || '';
      if (!quiz.revealed) {
        essayBox = '<div class="field" style="margin-top:16px">' +
          '<label class="label">你的解答 / Your answer（写计算步骤也可以只写要点）</label>' +
          '<textarea class="textarea" id="essayBox" data-input="essay" style="min-height:170px" placeholder="Write your working here…">' + esc(written) + '</textarea>' +
          '<div class="tiny muted" style="margin-top:6px">大题不自动判分：写完点「查看参考答案」，自己对照给分。</div>' +
        '</div>';
      } else {
        essayBox =
          (written ? '<div class="q-explain"><div class="hd">你的解答 / Your answer</div><div class="essay-model muted">' + esc(written) + '</div></div>' : '') +
          '<div class="q-explain good"><div class="hd">参考答案 / Model answer</div>' +
            '<div class="essay-model">' + esc(q.model || q.explain || '') + '</div>' +
            (q.source ? '<div class="q-source">📎 ' + esc(q.source) + '</div>' : '') +
          '</div>';
      }
    }

    const needSubmit = q.type === 'multiple' && !quiz.revealed && !quiz.timed;
    const nextLabel = quiz.idx === total - 1 ? (quiz.timed ? '交卷' : '查看结果') : '下一题';

    let action;
    if (isEssay) {
      if (!quiz.revealed) {
        action = '<button class="btn primary lg block" data-act="show-model">查看参考答案</button>';
      } else if (!quiz.graded) {
        action = '<div class="row" style="gap:10px">' +
          '<button class="btn lg" style="flex:1" data-act="grade" data-arg="0">答错了</button>' +
          '<button class="btn primary lg" style="flex:1" data-act="grade" data-arg="1">答对了</button>' +
        '</div>';
      } else {
        action = '<button class="btn primary lg block" data-act="next">' + nextLabel + '</button>';
      }
    } else if (quiz.revealed) {
      action = '<button class="btn primary lg block" data-act="next">' + nextLabel + ' <span class="kbd">Enter</span></button>';
    } else if (quiz.timed) {
      action = '<div><button class="btn primary lg block" data-act="next"' + (quiz.picked.length ? '' : ' disabled') + '>' + nextLabel + '</button>' +
        '<div class="tiny muted" style="text-align:center;margin-top:8px">模拟考不即时判题，交卷后统一看答案</div></div>';
    } else if (needSubmit) {
      action = '<button class="btn primary lg block" data-act="submit"' + (quiz.picked.length ? '' : ' disabled') + '>提交答案</button>';
    } else {
      action = '<div class="row" style="justify-content:center"><span class="tiny muted">选择选项作答</span></div>';
    }

    layer.innerHTML =
      '<div class="quiz"><div class="quiz-inner">' +
        '<div class="quiz-top">' +
          '<button class="btn ghost sm" data-act="quit">✕ 退出</button>' +
          '<div class="quiz-prog">' +
            '<div class="row"><span>第 ' + (quiz.idx + 1) + ' / ' + total + ' 题</span>' +
              '<span>' + (quiz.timed ? '⏱ <span id="quizTimer" class="quiz-timer">' + fmtMs(quiz.remaining * 1000) + '</span>' : '连击 ' + quiz.combo + '') + '</span></div>' +
            '<div class="bar sm"><i style="width:' + pct + '%"></i></div>' +
          '</div>' +
        '</div>' +
        '<div class="quiz-body card">' +
          '<div class="q-meta">' +
            '<span class="badge brand">' + (isEssay ? '大题 / Open-ended' : q.type === 'multiple' ? '多选 / Multiple' : '单选 / Single') + '</span>' +
            (q.chapter ? '<span class="badge">' + esc(q.chapter) + '</span>' : '') +
            (q.topic ? '<span class="badge">' + esc(q.topic) + '</span>' : '') +
            (q.difficulty ? '<span class="badge warn">' + esc(q.difficulty) + '</span>' : '') +
            '<span class="spacer"></span>' +
            (quiz.combo >= 3 && !isEssay ? '<span class="badge ok">🔥 ' + quiz.combo + ' 连击</span>' : '') +
          '</div>' +
          '<div class="q-stem">' + rich(q.stem) + '</div>' +
          (isEssay ? essayBox : '<div class="q-options">' + options + '</div>' + explain) +
        '</div>' +
        '<div class="quiz-actions">' + action + '</div>' +
      '</div></div>';
  }

  function applyAnswer(q, ok, mode) {
    const st = S.qStats[q.id] || (S.qStats[q.id] = { seen: 0, correct: 0, wrong: 0, streak: 0, last: 0 });
    st.seen++;
    st.last = Date.now();
    if (ok) st.correct++; else st.wrong++;

    const cs = S.chapterStats[q.chapter || '未分类'] || (S.chapterStats[q.chapter || '未分类'] = { seen: 0, correct: 0 });
    cs.seen++;
    if (ok) cs.correct++;

    const i = S.notebook.indexOf(q.id);
    if (ok) {
      st.streak = (st.streak || 0) + 1;
      if (i >= 0 && st.streak >= 2) {
        S.notebook.splice(i, 1);
        S.masteredCount = (S.masteredCount || 0) + 1;
        st.streak = 0;
      }
      if (mode === 'review') S.daily.reviewed++;
      S.daily.correct++;
    } else {
      st.streak = 0;
      if (i < 0) S.notebook.push(q.id);
    }
  }

  function commit(silent) {
    const q = quiz.questions[quiz.idx];
    if (quiz.answers[quiz.idx]) return;
    const ok = sameSet(quiz.picked, q.answer);
    quiz.answers[quiz.idx] = { picked: quiz.picked.slice(), ok: ok };
    applyAnswer(q, ok, quiz.mode);
    if (ok) {
      quiz.correct++;
      quiz.combo++;
      quiz.maxCombo = Math.max(quiz.maxCombo, quiz.combo);
      S.bestCombo = Math.max(S.bestCombo, quiz.combo);
      addXp(10 + (quiz.combo >= 3 ? 2 : 0));
      if (!silent && quiz.combo >= 3) comboFly(quiz.combo);
    } else {
      quiz.combo = 0;
    }
    quiz.revealed = true;
    save();
  }

  function comboFly(n) {
    const el = document.createElement('div');
    el.className = 'combo-fly';
    el.textContent = n + ' 连击!';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  function nextQuestion() {
    const total = quiz.questions.length;
    if (quiz.timed && !quiz.answers[quiz.idx]) {
      if (!quiz.picked.length) { toast('先选一个答案'); return; }
      commit(true);
    }
    if (quiz.idx < total - 1) {
      quiz.idx++;
      quiz.picked = [];
      quiz.revealed = false;
      quiz.graded = false;
      renderQuiz();
      window.scrollTo({ top: 0 });
    } else {
      finishQuiz(false);
    }
  }

  function finishQuiz(auto) {
    if (!quiz || quiz.finished) return;
    quiz.finished = true;
    clearInterval(timer);
    timer = null;
    const total = quiz.questions.length;
    const correct = quiz.correct;
    const ms = Date.now() - quiz.startedAt;
    const acc = total ? correct / total : 0;

    const bonus = 15 + (correct === total && total >= 5 ? 40 : 0);
    addXp(bonus, true);

    // 连续天数
    const today = todayKey();
    if (S.streak.last !== today) {
      S.streak.days = S.streak.last === yesterdayKey() ? (S.streak.days || 0) + 1 : 1;
      S.streak.last = today;
    }

    if (quiz.mode === 'mock') S.daily.mock++;
    S.history.push({
      at: Date.now(), mode: quiz.mode, total: total, correct: correct, ms: ms,
      limit: quiz.limit, acc: Math.round(acc * 100),
    });
    if (S.history.length > 60) S.history = S.history.slice(-60);

    const unlocked = checkAch(true);
    save(true);

    if (correct === total && total >= 5) confetti();
    renderResult(auto);
    if (unlocked.length) toast('解锁成就：' + unlocked.map((a) => a.name).join('、') + ' 🏅');
  }

          '<div class="stat"><div class="stat-val">' + quiz.maxCombo + '</div><div class="stat-lbl">最高连击</div></div>' +

  function confetti() {
    const c = $('#fx');
    if (!c) return;
    const ctx = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    const colors = ['#5b5bd6', '#8b5cf6', '#22d3ee', '#f59e0b', '#10b981', '#ef4444'];
    const parts = Array.from({ length: 100 }, () => ({
      x: window.innerWidth / 2 + (Math.random() - 0.5) * 200,
      y: window.innerHeight * 0.32,
      vx: (Math.random() - 0.5) * 12,
      vy: Math.random() * -11 - 2,
      r: Math.random() * 4 + 2,
      c: colors[Math.floor(Math.random() * colors.length)],
      a: 1,
    }));
    let t = 0;
    (function loop() {
      ctx.clearRect(0, 0, c.width, c.height);
      parts.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.38; p.a -= 0.011;
        ctx.globalAlpha = Math.max(0, p.a);
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      t++;
      if (t < 120) requestAnimationFrame(loop);
      else ctx.clearRect(0, 0, c.width, c.height);
    })();
  }

  /* ============================ 出题流程 ============================ */

  function generate() {
    const text = (S.material || '').trim();
    if (text.length < 60) { toast('资料太少了，至少粘贴一段完整的讲义'); return; }
    if (text.length > 200000) { toast('资料太长了（>20 万字），请分成几份'); return; }
    ui.busy = true;
    render();
    setTimeout(() => {
      try {
        const res = E.generate(text, {
          count: ui.genCount,
          seed: (Date.now() % 100000) + 1,
          difficulty: ui.genDiff,
          types: ui.genType,
        });
        ui.preview = res.questions || [];
        ui.warnings = res.warnings || [];
        ui.picked = new Set(ui.preview.map((_, i) => i));
        ui.lastStat = {
          chapters: (res.stat && res.stat.chapters) || 0,
          terms: (res.stat && res.stat.terms) || 0,
          sentences: (res.stat && res.stat.sentences) || 0,
        };
        if (!ui.preview.length) toast('没能生成题目，试试补充「术语：定义」式的句子');
      } catch (err) {
        ui.preview = [];
        ui.warnings = ['生成失败：' + (err && err.message ? err.message : err)];
      }
      ui.busy = false;
      render();
    }, 40);
  }

  function selectedPreview() {
    return ui.preview.filter((_, i) => ui.picked.has(i));

  function download(filename, text, mime) {
    const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);

  function exportBank() {

    download('quizforge-bank-' + todayKey() + '.json',
      JSON.stringify({ app: 'quizforge', v: 1, exportedAt: new Date().toISOString(), questions: S.bank }, null, 2),

  function exportCsv() {
    if (!S.bank.length) { toast('题库是空的'); return; }
    const head = ['章节', '主题', '题型', '难度', '题干', '选项A', '选项B', '选项C', '选项D', '选项E', '选项F', '答案', '解析'];
    const esc2 = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
    const lines = [head.map(esc2).join(',')];
    S.bank.forEach((q) => {
      const opts = q.options.concat(['', '', '', '', '', '']).slice(0, 6);
      lines.push([q.chapter, q.topic, q.type, q.difficulty, q.stem].concat(opts).concat([
        q.answer.map((i) => String.fromCharCode(65 + i)).join(''), q.explain,
      ]).map(esc2).join(','));

  function normalizeQuestion(raw) {
    if (!raw || typeof raw !== 'object') return null;

    // 大题 / 简答题：没有选项，靠参考答案自评
    if (raw.type === 'essay' || raw.type === 'text' || raw.type === 'short') {
      const stem = String(raw.stem || raw.question || '').trim();
      if (!stem) return null;
      return {
        id: raw.id || uid(),
        type: 'essay',
        chapter: String(raw.chapter || '导入题库'),
        topic: String(raw.topic || ''),
        difficulty: String(raw.difficulty || '应用'),
        stem: stem,
        options: [],
        answer: [],
        model: String(raw.answer || raw.model || raw.explain || ''),
        explain: String(raw.explain || ''),
        source: String(raw.source || ''),
        auto: !!raw.auto,
      };
    }

    let options = Array.isArray(raw.options) ? raw.options.map((o) => String(o)).filter((o) => o && o.trim()) : [];
    if (options.length < 2) return null;
    let ans = raw.answer;
    if (typeof ans === 'number') ans = [ans];
    if (typeof ans === 'string') ans = ans.split(/[,\s，、/]+/).filter(Boolean);
    if (!Array.isArray(ans)) return null;
    ans = ans.map((a) => {
      if (typeof a === 'string') {
        const t = a.trim().toUpperCase();
        if (t.length === 1) return 'ABCDEF'.indexOf(t);
        return parseInt(t, 10);
      }
      return Number(a);
    }).filter((n) => Number.isInteger(n) && n >= 0 && n < options.length);
    if (!ans.length) return null;
    ans = Array.from(new Set(ans)).sort((a, b) => a - b);
    const type = raw.type === 'multiple' || ans.length > 1 ? 'multiple' : 'single';
    return {
      id: raw.id || uid(),
      type: type,
      chapter: String(raw.chapter || '导入题库'),
      topic: String(raw.topic || ''),
      difficulty: String(raw.difficulty || '理解'),
      stem: String(raw.stem || raw.question || '').trim(),
      options: options,
      answer: ans,
      explain: String(raw.explain || raw.explanation || ''),
      source: String(raw.source || ''),
      auto: !!raw.auto,
    };
  }

  function importJson(text, asBackup) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { toast('JSON 解析失败'); return; }
    if (obj && obj.state) {
      if (!confirm('这是一份完整备份，导入会覆盖当前所有数据。继续？')) return;
      S = Object.assign(defaultState(), obj.state);
      save(true);
      render();
      toast('备份已恢复');
      return;
    }
    const arr = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.questions) ? obj.questions : null);
    if (!arr) { toast('没有找到 questions 数组'); return; }
    const list = arr.map(normalizeQuestion).filter(Boolean);
    const added = addQuestions(list);
    render();
    toast('导入完成：新增 ' + added + ' 题，跳过 ' + (list.length - added) + ' 题');
  }

  /* 云端题库：站点下的 banks/all.json（单个文件，整批替换）。
     打开页面自动拉取；内容有 v 版本号，版本变了才重新导入。
     云端题目标记 q.cloud = true，替换时只动这些，本地自己出的题不受影响。 */
  let syncing = false;

  function secureOrigin() {
    return location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  }

  async function syncBanks(manual) {
    if (syncing) return;
    if (!secureOrigin()) {
      if (manual) toast('本地文件模式不支持云端同步，部署到 https 后可用');
      return;
    }
    syncing = true;
    try {
      const res = await fetch('./banks/all.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) {
        if (manual) toast('还没有云端题库（banks/all.json）');
        return;
      }
      const data = await res.json();
      const version = String(data.v || data.version || '1');
      if (data.intro) S.intro = String(data.intro);
      const raw = Array.isArray(data) ? data : (data.questions || []);
      if (!raw.length) {
        if (manual) toast('云端题库是空的');
        return;
      }
      const incoming = raw.map(normalizeQuestion).filter(Boolean);
      incoming.forEach((q) => { q.cloud = true; });

      const prevCloud = S.bank.filter((q) => q.cloud);
      if (!manual && S.synced.all === version && prevCloud.length === incoming.length) return;

      // 整批替换云端部分：先摘掉旧的云端题（保留本地题），再重新加入
      if (prevCloud.length) {
        const keep = prevCloud.filter((p) => !incoming.some((n) => n.id === p.id)).map((p) => p.id);
        S.bank = S.bank.filter((q) => !q.cloud);
        keep.forEach((id) => {
          S.notebook = S.notebook.filter((x) => x !== id);
          delete S.qStats[id];
        });
      }

      const before = prevCloud.length;
      addQuestions(JSON.parse(JSON.stringify(incoming)));
      S.synced.all = version;
      save(true);
      render();
      const total = S.bank.filter((q) => q.cloud).length;
      if (manual || total !== before) {
        toast('云端题库已同步：共 ' + total + ' 题');
      }
    } catch (e) {
      if (manual) toast('同步失败：' + ((e && e.message) || e));
    } finally {
      syncing = false;
    }
  }

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result || ''));
      r.onerror = () => reject(new Error('读取失败'));
      r.readAsText(file, 'utf-8');
    });
  }
