      '<div class="field"><label class="label">题干</label><textarea class="textarea" id="editStem" style="min-height:80px">' + esc(q.stem) + '</textarea></div>' +
      '<div class="field" style="margin-top:10px"><label class="label">选项（勾选正确答案）</label>' + optRows + '</div>' +
      '<div class="form-grid" style="margin-top:10px;grid-template-columns:1fr 1fr">' +
        '<div class="field"><label class="label">章节</label><input class="input" id="editChapter" value="' + esc(q.chapter || '') + '"></div>' +
        '<div class="field"><label class="label">主题</label><input class="input" id="editTopic" value="' + esc(q.topic || '') + '"></div>' +
      '</div>' +
      '<div class="field" style="margin-top:10px"><label class="label">解析</label><textarea class="textarea" id="editExplain" style="min-height:70px">' + esc(q.explain || '') + '</textarea></div>' +
      '<div class="modal-foot"><button class="btn ghost" data-act="close-modal">取消</button>' +
        '<button class="btn primary" data-act="save-q" data-arg="' + q.id + '">保存</button></div>' +
    '</div>';
  }

  function saveEdit(id) {
    const q = findQ(id);
    if (!q) return;
    const stem = ($('#editStem') || {}).value || '';
    const opts = $$('[data-opt]').map((el) => el.value.trim()).filter(Boolean);
    const ans = $$('input[name="ans"]:checked').map((el) => Number(el.value));
    if (!stem.trim()) { toast('题干不能为空'); return; }
    if (opts.length < 2) { toast('至少要有两个选项'); return; }
    if (!ans.length) { toast('请勾选正确答案'); return; }
    q.stem = stem.trim();
    q.options = opts;
    q.answer = ans.filter((i) => i < opts.length).sort((a, b) => a - b);
    q.type = q.answer.length > 1 ? 'multiple' : 'single';
    q.chapter = ($('#editChapter') || {}).value || q.chapter;
    q.topic = ($('#editTopic') || {}).value || '';
    q.explain = ($('#editExplain') || {}).value || '';
    save(true);
    closeModal();
    render();
    toast('已保存');
  }

  function closeModal() {
    const m = $('#modal');
    m.hidden = true;
    m.innerHTML = '';
  }

  /* ============================ 事件 ============================ */

  function onClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const arg = el.dataset.arg;

    switch (act) {
      case 'nav':
        if (quiz) { if (!confirm('正在答题，确定离开吗？')) return; exitQuiz(); }
        go(arg);
        break;
      case 'mode':
        ui.mode = arg;
        render();
        break;
      case 'count':
        if (ui.mode === 'mock') ui.mockCount = Number(arg); else ui.count = Number(arg);
        render();
        break;
      case 'start':
        startQuiz(ui.mode);
        break;
      case 'start-review':
        ui.mode = 'review';
        startQuiz('review');
        break;
      case 'theme': {
        const root = document.documentElement;
        const dark = root.dataset.theme === 'dark';
        root.dataset.theme = dark ? 'light' : 'dark';
        S.settings.theme = root.dataset.theme;
        save(true);
        render();
        break;
      }
      case 'opt':
        if (!quiz || quiz.revealed) return;
        {
          const i = Number(arg);
          const q = quiz.questions[quiz.idx];
          if (q.type === 'multiple') {
            const at = quiz.picked.indexOf(i);
            if (at >= 0) quiz.picked.splice(at, 1); else quiz.picked.push(i);
            renderQuiz();
          } else {
            quiz.picked = [i];
            if (quiz.timed) renderQuiz();
            else { commit(false); renderQuiz(); }
          }
        }
        break;
      case 'show-model': {
        if (!quiz) return;
        const box = $('#essayBox');
        if (box) quiz.written[quiz.idx] = box.value;
        quiz.revealed = true;
        renderQuiz();
        break;
      }
      case 'grade': {
        if (!quiz || !quiz.revealed) return;
        if (quiz.answers[quiz.idx]) { quiz.graded = true; renderQuiz(); return; }
        const okGrade = arg === '1';
        const q = quiz.questions[quiz.idx];
        quiz.answers[quiz.idx] = { picked: [], ok: okGrade, written: quiz.written[quiz.idx] || '' };
        applyAnswer(q, okGrade, quiz.mode);
        if (okGrade) {
          quiz.correct++;
          quiz.combo++;
          quiz.maxCombo = Math.max(quiz.maxCombo, quiz.combo);
          S.bestCombo = Math.max(S.bestCombo, quiz.combo);
          addXp(10);
        } else {
          quiz.combo = 0;
        }
        quiz.graded = true;
        save();
        renderQuiz();
        break;
      }
      case 'submit':
        if (!quiz) return;
        if (!quiz.picked.length) { toast('先选择答案'); return; }
        commit(false);
        renderQuiz();
        break;
      case 'next':
        nextQuestion();
        break;
      case 'quit':
        if (confirm('退出后本次练习不计入记录，确定吗？')) exitQuiz();
        break;
      case 'exit':
        exitQuiz();
        break;
      case 'again':
        { const mode = quiz ? quiz.mode : 'level'; exitQuiz(); startQuiz(mode === 'review' ? 'review' : mode); }
        break;
      case 'again-wrong': {
        const ids = quiz ? quiz.questions.map((q, i) => (quiz.answers[i] && !quiz.answers[i].ok ? q.id : null)).filter(Boolean) : [];
        exitQuiz();
        startQuiz('review', ids.length ? ids : undefined);
        break;
      }
      case 'pick-file':
        { const f = $('#file'); if (f) f.click(); }
        break;
      case 'generate':
        if (!ui.busy) generate();
        break;
      case 'regen':
        generate();
        break;
      case 'toggle-preview':
        {
          const i = Number(arg);
          if (ui.picked.has(i)) ui.picked.delete(i); else ui.picked.add(i);
          render();
        }
        break;
      case 'toggle-all':
        if (ui.picked.size === ui.preview.length) ui.picked = new Set();
        else ui.picked = new Set(ui.preview.map((_, i) => i));
        render();
        break;
      case 'add-selected':
        addSelected(false);
        break;
      case 'practice-selected':
        addSelected(true);
        break;
      case 'load-sample':
        S.material = DemoData.material || '';
        S.materialName = '示例资料 · 心理学导论';
        save(true);
        render();
        toast('已填入示例资料，点「生成习题」试试');
        break;
      case 'load-demo-bank': {
        const added = addQuestions(JSON.parse(JSON.stringify(DemoData.bank || [])));
        if (!S.material) {
          S.material = DemoData.material || '';
          S.materialName = '示例资料 · 心理学导论';
        }
        save(true);
        render();
        toast('已载入 ' + added + ' 道示例题');
        break;
      }
      case 'clear-material':
        S.material = '';
        S.materialName = '';
        ui.preview = [];
        ui.picked = new Set();
        save(true);
        render();
        break;
      case 'del-q':
        if (confirm('删除这道题？')) { removeQuestion(arg); render(); toast('已删除'); }
        break;
      case 'edit-q':
        openEdit(arg);
        break;
      case 'save-q':
        saveEdit(arg);
        break;
      case 'close-modal':
        closeModal();
        break;
      case 'import-file':
        { const f = $('#importFile'); if (f) f.click(); }
        break;
      case 'sync-bank':
        syncBanks(true);
        break;
      case 'export-bank':
        exportBank();
        break;
      case 'export-csv':
        exportCsv();
        break;
      case 'wipe-bank':
        if (confirm('清空整个题库？成绩与错题记录会保留。')) {
          S.bank = [];
          S.notebook = [];
          ui.chapter = 'all'; ui.topic = 'all'; ui.bankChapter = 'all';
          save(true);
          render();
          toast('题库已清空');
        }
        break;
      case 'clear-notebook':
        if (confirm('清空错题本？')) { S.notebook = []; save(true); render(); }
        break;
      case 'export-backup':
        download('quizforge-backup-' + todayKey() + '.json', JSON.stringify({ app: 'quizforge', v: 1, state: S }, null, 2), 'application/json');
        toast('备份已导出');
        break;
      case 'import-backup':
        { const f = $('#backupFile'); if (f) f.click(); }
        break;
      case 'reset-all':
        if (confirm('确定清空所有数据（题库、成绩、错题、经验）？此操作不可恢复。')) {
          S = defaultState();
          ui.chapter = 'all'; ui.topic = 'all'; ui.type = 'all'; ui.diff = 'all';
          ui.bankChapter = 'all'; ui.search = ''; ui.preview = []; ui.picked = new Set(); ui.warnings = [];
          save(true);
          render();
          toast('已重置');
        }
        break;
      default:
        break;
    }
  }

  function onChange(e) {
    const el = e.target;
    const key = el.dataset && el.dataset.input;
    if (!key) return;
    const v = el.value;
    if (key === 'chapter') { ui.chapter = v; ui.topic = 'all'; render(); }
    else if (key === 'topic') { ui.topic = v; render(); }
    else if (key === 'type') { ui.type = v; render(); }
    else if (key === 'diff') { ui.diff = v; render(); }
    else if (key === 'bankChapter') { ui.bankChapter = v; render(); }
    else if (key === 'genCount') { ui.genCount = Number(v); }
    else if (key === 'genType') { ui.genType = v; }
    else if (key === 'genDiff') { ui.genDiff = v; }
    else if (key === 'search') { applySearch(v); }
    else if (key === 'material') {
      S.material = v;
      save();
      const chips = $('#fileChips');
      if (chips) chips.innerHTML = '<span class="badge">' + v.length + ' 字</span>';
    }
  }

  function onInput(e) {
    const el = e.target;
    if (!el.dataset || !el.dataset.input) return;
    const key = el.dataset.input;
    if (key === 'search') { applySearch(el.value); return; }
    if (key === 'essay') { if (quiz) quiz.written[quiz.idx] = el.value; return; }
    if (key === 'material') {
      S.material = el.value;
      save();
    }
  }

  function applySearch(v) {
    ui.search = v;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      render();
      const el = $('[data-input="search"]');
      if (el) { el.focus(); try { el.setSelectionRange(v.length, v.length); } catch (e) { /* ignore */ } }
    }, 220);
  }

  function onKey(e) {
    if (!quiz || quiz.finished) return;
    if (e.key === 'Enter') {
      if (quiz.revealed) { e.preventDefault(); nextQuestion(); }
      else if (quiz.timed && quiz.picked.length) { e.preventDefault(); nextQuestion(); }
      else if (quiz.questions[quiz.idx].type === 'multiple' && quiz.picked.length) { e.preventDefault(); commit(false); renderQuiz(); }
      return;
    }
    const idx = 'abcdef'.indexOf(e.key.toLowerCase());
    const num = parseInt(e.key, 10) - 1;
    const q = quiz.questions[quiz.idx];
    let i = -1;
    if (idx >= 0) i = idx;
    else if (num >= 0 && num < 6) i = num;
    if (i >= 0 && i < q.options.length && !quiz.revealed) {
      e.preventDefault();
      const el = document.querySelector('[data-act="opt"][data-arg="' + i + '"]');
      if (el) el.click();
    }
  }

  /* ============================ 文件选择 ============================ */

  async function handleMaterialFile(file) {
    if (!file) return;
    toast('正在读取 ' + file.name + ' …');
    try {
      const res = await Ingest.readFile(file);
      if (!res.text || res.text.trim().length < 20) {
        toast('这个文件里几乎没提取到文字（可能是扫描件）');
        return;
      }
      S.material = res.text;
      S.materialName = file.name;
      save(true);
      render();
      toast('已读取 ' + file.name + '（' + res.text.length + ' 字），可以生成习题了');
    } catch (err) {
      toast((err && err.message) || '读取失败');
    }
  }

  function bindFileInputs() {
    document.addEventListener('change', (e) => {
      const t = e.target;
      if (t.id === 'file') {
        const f = t.files && t.files[0];
        t.value = '';
        handleMaterialFile(f);
      } else if (t.id === 'importFile') {
        const f = t.files && t.files[0];
        t.value = '';
        if (f) readFileAsText(f).then((txt) => importJson(txt)).catch(() => toast('读取失败'));
      } else if (t.id === 'backupFile') {
        const f = t.files && t.files[0];
        t.value = '';
        if (f) readFileAsText(f).then((txt) => importJson(txt, true)).catch(() => toast('读取失败'));
      }
    });
  }

  let dragDepth = 0;
  function bindDrag() {
    const isDrop = (e) => {
      const t = e.target;
      return t && t.id === 'drop';
    };
    document.addEventListener('dragover', (e) => {
      if (isDrop(e)) { e.preventDefault(); e.target.classList.add('over'); }
    });
    document.addEventListener('dragleave', (e) => {
      if (isDrop(e)) e.target.classList.remove('over');
    });
    document.addEventListener('drop', (e) => {
      if (!isDrop(e)) return;
      e.preventDefault();
      e.target.classList.remove('over');
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      handleMaterialFile(f);
    });
  }

  /* ============================ 启动 ============================ */

  function applyTheme() {
    const saved = (S.settings && S.settings.theme) || 'auto';
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = saved === 'auto' ? (prefersDark ? 'dark' : 'light') : saved;
    document.documentElement.dataset.theme = theme;
  }

  function setupPwa() {
    const host = location.hostname;
    const secure = location.protocol === 'https:' || host === 'localhost' || host === '127.0.0.1';
    if (!secure) return;

    try {
      const icon = document.createElement('link');
      icon.rel = 'apple-touch-icon';
      icon.href = './icon-192.png';
      document.head.appendChild(icon);
    } catch (e) { /* ignore */ }

    // 兼容上传时被改成全大写的文件名
    (async () => {
      const names = ['./manifest.webmanifest', './MANIFEST.webmanifest'];
      for (const name of names) {
        try {
          const r = await fetch(name, { cache: 'no-store' });
          if (r.ok) {
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = name;
            document.head.appendChild(link);
            return;
          }
        } catch (e) { /* 继续试下一个 */ }
      }
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => { /* 单文件模式或未上传 sw.js 时静默失败 */ });
      });
    }
  }

  function init() {
    load();
    applyTheme();
    ensureDaily();
    setupPwa();

    const params = new URLSearchParams(location.search);
    if (params.get('seed') === '1' && !S.bank.length) {
      S.bank = JSON.parse(JSON.stringify(DemoData.bank || []));
      S.material = DemoData.material || '';
      S.materialName = '示例资料 · 心理学导论';
      save(true);
    }

    routeFromHash();
    render();
    bindFileInputs();
    bindDrag();

    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('keydown', onKey);
    window.addEventListener('hashchange', () => { routeFromHash(); render(); });

    if (params.get('play') === '1' && S.bank.length) {
      setTimeout(() => startQuiz('level'), 120);
    }

    setTimeout(() => { syncBanks(false); }, 500);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
